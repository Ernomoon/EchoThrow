name: Build installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target EchoThrow_VST3 --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ env.VERSION_NAME }}" "/DBundleDir=$PWD\build\EchoThrow_artefacts\Release\VST3\EchoThrow.vst3" "installer\windows\EchoThrow.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoThrow-Windows-Installer
          path: installer/windows/Output/EchoThrow-Setup-Windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3
        run: cmake --build build --config Release --target EchoThrow_VST3 --parallel

      - name: Build installer
        run: bash installer/macos/build_pkg.sh "build/EchoThrow_artefacts/Release/VST3/EchoThrow.vst3" "${{ env.VERSION_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: EchoThrow-macOS-Installer
          path: installer/macos/Output/EchoThrow-macOS.pkg

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EchoThrow-Setup-Windows.exe
            dist/EchoThrow-macOS.pkg
          generate_release_notes: true
